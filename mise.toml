[tools]
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"] }
bun = "1.4.3"

[tasks.fmt]
description = "Format the Rust workspace"
run = ["cargo fmt --all", "rustfmt --edition 2021 tools/build-exe/main.rs"]

[tasks."fmt:check"]
description = "Check Rust formatting"
run = ["cargo fmt --all -- --check", "rustfmt --edition 2021 --check tools/build-exe/main.rs"]

[tasks.test]
description = "Run portable workspace tests"
run = "cargo test --workspace --locked"

[tasks.lint]
description = "Check Rust code with Clippy"
run = "cargo clippy --workspace --all-targets --locked"

[tasks.check]
description = "Run formatting, tests and Clippy"
depends = ["fmt:check", "test", "lint", "test:build"]

[tasks.build]
description = "Build the standalone CLI in release mode"
run = "cargo build --release -p hmail-cleaner --locked"
run_windows = "mise run build:windows"

[tasks."build:windows"]
description = "Build the x64 Windows CLI with a static MSVC runtime (requires MSVC tools)"
env.RUSTFLAGS = "-C target-feature=+crt-static"
run = "cargo build --release -p hmail-cleaner --target x86_64-pc-windows-msvc --locked"

[tasks."db:up"]
description = "Start disposable MySQL 5.7.21 for integration tests"
env.HMAIL_TEST_DOCKER_CONTEXT = "{{ env.HMAIL_TEST_DOCKER_CONTEXT | default(value='colima-hmail-cleanup') }}"
run = 'docker --context "$HMAIL_TEST_DOCKER_CONTEXT" compose -p hmail-cleanup-tests -f crates/adapters/tests/fixtures/mysql.compose.yml up -d --wait --wait-timeout 120'
run_windows = 'powershell.exe -NoProfile -Command "docker --context $env:HMAIL_TEST_DOCKER_CONTEXT compose -p hmail-cleanup-tests -f crates/adapters/tests/fixtures/mysql.compose.yml up -d --wait --wait-timeout 120; exit $LASTEXITCODE"'

[tasks."db:down"]
description = "Stop and remove only the disposable MySQL test project"
env.HMAIL_TEST_DOCKER_CONTEXT = "{{ env.HMAIL_TEST_DOCKER_CONTEXT | default(value='colima-hmail-cleanup') }}"
run = 'docker --context "$HMAIL_TEST_DOCKER_CONTEXT" compose -p hmail-cleanup-tests -f crates/adapters/tests/fixtures/mysql.compose.yml down --volumes'
run_windows = 'powershell.exe -NoProfile -Command "docker --context $env:HMAIL_TEST_DOCKER_CONTEXT compose -p hmail-cleanup-tests -f crates/adapters/tests/fixtures/mysql.compose.yml down --volumes; exit $LASTEXITCODE"'

[tasks."test:db"]
description = "Run integration tests against disposable MySQL"
depends = ["db:up"]
env.HMAIL_TEST_DATABASE_URL = "{{ env.HMAIL_TEST_DATABASE_URL | default(value='mysql://root:hmail_fixture@127.0.0.1:13306/mysql?ssl-mode=disabled') }}"
run = "cargo test -p hmail-cleaner-adapters --locked -- --ignored --test-threads=1"

[tasks."build:exe"]
description = "Собрать Windows EXE и SHA-256 в корень проекта"
dir = "{{ config_root }}"
run = "sh tools/build-exe.sh"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-exe.ps1"

[tasks."test:agent-db"]
description = "Run agent integration tests against disposable MySQL"
depends = ["db:up"]
env.HMAIL_TEST_DATABASE_URL = "{{ env.HMAIL_TEST_DATABASE_URL | default(value='mysql://root:hmail_fixture@127.0.0.1:13306/mysql?ssl-mode=disabled') }}"
run = "cargo test -p hmail-cleaner-agent --test execution --locked -- --ignored --test-threads=1"

[tasks."build:agent"]
description = "Build the standalone Windows agent package"
dir = "{{ config_root }}"
run = "sh tools/build-exe.sh --component agent"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-exe.ps1 -Component agent"

[tasks."test:build"]
description = "Проверить публикацию EXE и передачу исходников без env-файлов"
dir = "{{ config_root }}"
run = "sh tools/build-exe.sh --test"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-exe.ps1 -Test"

[tasks."build:center"]
description = "Build the standalone center without mail/Windows cleanup dependencies"
run = "cargo build --release -p hmail-cleaner --no-default-features --features center --locked"

[tasks."contracts:generate"]
description = "Generate browser schemas, TypeScript and standalone validators from Rust DTOs"
run = "bun run contracts:generate"

[tasks."contracts:check"]
description = "Verify generated browser contracts are current"
run = "bun run contracts:check"

[tasks."web:check"]
description = "Check Astro, Svelte, TypeScript and browser API tests"
run = "bun run web:check"

[tasks."web:build"]
description = "Build static Astro pages and Svelte islands"
run = "bun run web:build"

[tasks."release:local"]
description = "Build a local immutable center image and matching Windows agent package without publishing"
run = "bun tools/release/build.ts"

[tasks."test:delivery"]
description = "Verify local OCI release bytes and disposable center lifecycle"
run = ["bun apps/web/node_modules/typescript/bin/tsc --project tools/release/tsconfig.json", "bun test ./tools/release/tests tools/release/agent-manifest.test.ts", "bun tools/release/verify.ts"]

[tasks."test:mvp"]
description = "Run isolated MVP checks and emit separate PASS, FAIL and NOT RUN receipts"
run = ["bun apps/web/node_modules/typescript/bin/tsc --project tools/acceptance/tsconfig.json", "bun tools/acceptance/run.ts"]

[tasks."measure:mvp"]
description = "Build and measure a separate release center with static web and two TLS fixtures"
run = ["bun apps/web/node_modules/typescript/bin/tsc --project tools/acceptance/tsconfig.json", "bun tools/acceptance/prepare-measurement.ts"]

[tasks."release:test"]
description = "Check release tooling and signed publication contracts"
run = ["bun apps/web/node_modules/typescript/bin/tsc --project tools/release/tsconfig.json", "bun test ./tools/release/tests tools/release/agent-manifest.test.ts"]

[tasks."delivery:test"]
description = "Verify updater and graceful replacement behavior"
run = "cargo test -p astra-updater --locked"

[tasks."test:updates"]
description = "Record local delivery verification; native target acceptance stays separate"
run = "bun tools/acceptance/delivery/run.ts"
