[package]
name = "hmail-cleaner-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
cli = ["dep:clap"]

[dependencies]
ring = "0.17.14"

hmail-cleaner-protocol = { path = "../protocol" }
clap = { version = "4", optional = true, features = ["derive"] }
hmail-cleaner-adapters = { path = "../adapters", default-features = false, features = ["mail", "mtls"] }
hmail-cleaner-core = { path = "../core" }
hmail-cleaner-runner = { path = "../runner" }
tokio.workspace = true
axum = "0.8"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
chrono.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
zeroize = "1.9.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
chrono-tz = "0.10"
tower = { version = "0.5", features = ["util"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Services", "Win32_Storage_FileSystem"] }
widestring = "1"
