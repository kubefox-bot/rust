[package]
name = "hmail-cleaner-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
hmail-cleaner-protocol = { path = "../protocol" }
hmail-cleaner-adapters = { path = "../adapters", default-features = false, features = ["mtls"] }
chrono.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
zeroize = "1.9.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
