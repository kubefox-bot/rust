[package]
name = "astra-updater"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
uuid = { workspace = true, features = ["v4", "serde"] }
url = "2"
libc = "0.2"
axum = "0.8"
rustls-native-certs = "0.8.5"
chrono.workspace = true
hmail-cleaner-protocol = { path = "../protocol" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
