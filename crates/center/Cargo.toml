[package]
name = "hmail-cleaner-center"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ring = "0.17.14"
zeroize = { version = "1.9.1", features = ["serde"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
subtle = "2.6"
tokio.workspace = true

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
