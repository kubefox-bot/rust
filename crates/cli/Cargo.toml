[package]
name = "hmail-cleaner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["local-cli"]
local-cli = ["dep:hmail-cleaner-runner", "dep:hmail-cleaner-core", "dep:hmail-cleaner-adapters", "dep:chrono", "dep:serde", "dep:thiserror", "dep:serde_json", "dep:clap", "dep:dotenvy", "dep:crossterm", "dep:windows-sys"]
agent = ["dep:hmail-cleaner-agent"]

[dependencies]
hmail-cleaner-runner = { path = "../runner", optional = true }
hmail-cleaner-core = { path = "../core", optional = true }
hmail-cleaner-adapters = { path = "../adapters", optional = true }
hmail-cleaner-agent = { path = "../agent", optional = true, features = ["cli"] }
chrono = { workspace = true, optional = true }
tokio.workspace = true
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
dotenvy = { version = "0.15", optional = true }
crossterm = { version = "0.29.0", optional = true, default-features = false, features = ["windows"] }

[dev-dependencies]
chrono-tz = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_System_Console"] }
