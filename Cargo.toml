[workspace]
members = ["crates/core", "crates/adapters", "crates/cli"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
