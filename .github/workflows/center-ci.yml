name: Astra center CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      build:
        value: ${{ jobs.release.outputs.build }}
      source_sha:
        value: ${{ jobs.release.outputs.source_sha }}
      artifact_name:
        value: ${{ jobs.release.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.release.outputs.artifact_id }}

permissions:
  contents: read

env:
  HMAIL_BUILD_VERSION: git-${{ github.sha }}

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('Cargo.lock', 'mise.toml') }}
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise run check
      - run: mise run contracts:check
      - run: mise run web:check
      - run: mise run web:build
      - run: mise run release:test
      - run: mise run release:contracts:check
      - run: mise run appliance:test
      - run: mise run delivery:test

  mysql:
    runs-on: ubuntu-24.04
    env:
      HMAIL_TEST_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - run: mise run test:db
      - run: mise run test:agent-db
      - if: always()
        run: mise run db:down

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('Cargo.lock', 'mise.toml') }}
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise run check
      - run: mise run build:agent
      - name: Verify installer with Windows PowerShell 5.1 fixtures (no Hyper-V VM)
        shell: powershell
        run: .\tools\appliance\tests\installer.ps1
      - run: mise exec -- cargo build -p hmail-cleaner-adapters --example scm_fixture --locked
      - name: Verify isolated SCM fixture (Server 2016 acceptance is separate)
        shell: pwsh
        run: |
          $env:HMAIL_SCM_FIXTURE_EXE = (Resolve-Path target/debug/examples/scm_fixture.exe).Path
          mise exec -- cargo test -p hmail-cleaner-adapters --test service --locked -- --ignored --test-threads=1
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astra-agent-${{ github.sha }}
          path: dist/agent/windows-x64/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [portable, mysql, windows]
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.identity.outputs.build }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      artifact_name: astra-release-${{ github.sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      HMAIL_RELEASE_ENGINE: docker
      HMAIL_RELEASE_PLATFORM: linux/amd64
      HMAIL_RELEASE_IMAGE: ghcr.io/kubefox-bot/astra-center
      HMAIL_RELEASE_AGENT_PACKAGE: ${{ github.workspace }}/target/ci-agent
      HMAIL_DELIVERY_DIRECTORY: ${{ github.workspace }}/target/releases/git-${{ github.sha }}
      HMAIL_DELIVERY_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: astra-agent-${{ github.sha }}
          path: target/ci-agent
      - run: mise exec -- bun install --frozen-lockfile
      - name: Build once using native agent from this same workflow run
        run: mise run release:local
      - name: Build same-SHA Linux host updater bootstrap package
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- cargo build --release -p astra-updater --locked
          mise exec -- bun tools/release/updater-package.ts --binary "$GITHUB_WORKSPACE/target/release/astra-updater" --output "$GITHUB_WORKSPACE/target/host-updater" --source-sha "$HMAIL_DELIVERY_SOURCE_SHA"
          mkdir -p "$HMAIL_DELIVERY_DIRECTORY/host-updater"
          cp target/host-updater/astra-updater-linux-amd64.tar.gz target/host-updater/package-manifest.json "$HMAIL_DELIVERY_DIRECTORY/host-updater/"
      - name: Verify exact OCI bytes and isolated center lifecycle
        env:
          HMAIL_RELEASE_MANIFEST: ${{ env.HMAIL_DELIVERY_DIRECTORY }}/release-manifest.json
        run: mise run test:delivery
      - name: Install isolated disk editing tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libguestfs-tools qemu-utils unzip zip xfsprogs linux-image-generic
          kernel=$(find /lib/modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$kernel"
          sudo install -m 0644 "/boot/vmlinuz-$kernel" "$GITHUB_WORKSPACE/target/appliance-kernel"
          printf 'SUPERMIN_KERNEL=%s\nSUPERMIN_MODULES=%s\n' "$GITHUB_WORKSPACE/target/appliance-kernel" "/lib/modules/$kernel" >> "$GITHUB_ENV"
      - name: Build and read back unbooted FCOS Hyper-V appliance
        env:
          HMAIL_APPLIANCE_OUTPUT: ${{ env.HMAIL_DELIVERY_DIRECTORY }}/appliance
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_BACKEND_SETTINGS: force_tcg
        run: mise run appliance:build
      - name: Bind green lifecycle receipt to source and release manifest
        run: mise exec -- bun tools/release/ci-receipt.ts
      - id: identity
        shell: bash
        run: |
          printf 'build=%s\nsource_sha=%s\n' "$HMAIL_BUILD_VERSION" "$HMAIL_DELIVERY_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        with:
          name: astra-release-${{ github.sha }}
          path: |
            target/releases/git-${{ github.sha }}/
            !target/releases/git-${{ github.sha }}/delivery-*/
          if-no-files-found: error
          retention-days: 14
