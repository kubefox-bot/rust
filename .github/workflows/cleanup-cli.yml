name: hMailServer CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - run: mise run check

  mysql:
    runs-on: ubuntu-24.04
    env:
      HMAIL_TEST_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - run: mise run test:db
      - if: always()
        run: mise run db:down

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.10.3
      - run: mise run check
      - run: mise run build:exe
      - run: mise exec -- cargo build -p hmail-cleaner-adapters --example scm_fixture --locked
      - name: Test isolated SCM host
        shell: pwsh
        run: |
          $env:HMAIL_SCM_FIXTURE_EXE = (Resolve-Path target/debug/examples/scm_fixture.exe).Path
          mise exec -- cargo test -p hmail-cleaner-adapters --test service --locked -- --ignored --test-threads=1
          exit $LASTEXITCODE
      - run: .\hmail-cleaner.exe --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hmail-cleaner-windows-x64
          path: |
            hmail-cleaner.exe
            hmail-cleaner.exe.sha256
          if-no-files-found: error
